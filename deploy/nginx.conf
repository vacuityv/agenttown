# /etc/nginx/conf.d/agenttown.conf  (Cloudflare proxied, Full (strict) with a CF Origin Certificate)
#
# SECURITY: the server trusts X-Real-IP (TRUST_PROXY=1), which is set below from CF-Connecting-IP. Anyone who can reach
# this origin directly can forge that header and dodge every per-IP limit (registration, reports, SSE caps, API rate
# limit). So the origin must only accept traffic from Cloudflare — pick one:
#   1. Firewall 443 to Cloudflare's ranges (https://www.cloudflare.com/ips-v4, /ips-v6), e.g. with ufw/iptables or the
#      cloud security group; or, in nginx, inside the 443 server block:
#        include /etc/nginx/cloudflare-allow.conf;   # lines "allow 173.245.48.0/20;" … for every CF range, then:
#        deny all;
#      (refresh the list from the URLs above now and then).
#   2. Authenticated Origin Pulls (Cloudflare → SSL/TLS → Origin Server → on), and in the 443 server block:
#        ssl_client_certificate /etc/ssl/agenttown/cloudflare-origin-pull-ca.pem;
#        ssl_verify_client on;
# Either way, only Cloudflare can talk to nginx, so $http_cf_connecting_ip is genuine.
server {
    listen 10.0.0.193:80;
    server_name agenttown.xyz www.agenttown.xyz;
    return 301 https://agenttown.xyz$request_uri;
}

server {
    # Other services on this host bind public IPs on 80/443 (xray); nginx only uses the private one.
    listen 10.0.0.193:443 ssl http2;
    server_name agenttown.xyz www.agenttown.xyz;

    ssl_certificate     /etc/ssl/agenttown/origin.pem;
    ssl_certificate_key /etc/ssl/agenttown/origin.key;

    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
    }

    location /v1/stream {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
