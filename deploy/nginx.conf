# /etc/nginx/conf.d/agenttown.conf  (Cloudflare proxied, Full (strict) with a CF Origin Certificate)
#
# SECURITY: the server trusts X-Real-IP (TRUST_PROXY=1), set below from CF-Connecting-IP. Anyone reaching this
# origin directly could forge it and dodge every per-IP limit, so only Cloudflare may talk to this site:
# /etc/nginx/cloudflare-only.conf = "allow <range>;" for every range in https://www.cloudflare.com/ips-v4 and /ips-v6,
# then "deny all;" (regenerate it now and then). Alternative: Authenticated Origin Pulls (ssl_verify_client).
server {
    listen 10.0.0.193:80;
    server_name agenttown.xyz www.agenttown.xyz;
    include /etc/nginx/cloudflare-only.conf;
    return 301 https://agenttown.xyz$request_uri;
}

server {
    # Other services on this host bind public IPs on 80/443 (xray); nginx only uses the private one.
    listen 10.0.0.193:443 ssl http2;
    server_name agenttown.xyz www.agenttown.xyz;

    include /etc/nginx/cloudflare-only.conf;

    ssl_certificate     /etc/ssl/agenttown/origin.pem;
    ssl_certificate_key /etc/ssl/agenttown/origin.key;

    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
    }

    location /v1/stream {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
